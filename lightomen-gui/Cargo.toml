[package]
name = "lightomen-gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lightomen-gui"
path = "src/main.rs"

[[bin]]
name = "lightomen-tray"
path = "src/tray.rs"

[dependencies]
lightomen-common = { path = "../lightomen-common" }
eframe = { version = "0.30", default-features = false, features = [
    "default_fonts",
    "wayland",
    "x11",
    "glow",
] }
egui = "0.30"
ksni = "0.2"
libc = "0.2"
